# Reference snippets to merge into /mnt/dietpi_userdata/homeassistant/configuration.yaml
#
# Only the `homeassistant: packages:` block is added automatically by the
# migration. The `homekit:` block below is OPTIONAL — use it only if you
# prefer YAML-based HomeKit over the official HomeKit Bridge integration.
#
# Recommended path (post-migration):
#   HA UI → Settings → Devices & Services → Add Integration → HomeKit Bridge
#   Select switch + climate domains, or pick specific eSMART entities.
#   HA shows a setup code you use in the Home app.

homeassistant:
  packages: !include_dir_named packages

